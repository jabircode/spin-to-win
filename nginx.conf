server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static files, fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Disable caching for config files so updates take effect immediately
    location ~* ^/(config\.css|config\.js|prizes\.js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
